name: CI

# The gate this repo already had, run by a machine instead of by whoever
# remembers. tests/run_tests.sh is the whole contract: it exits non-zero on
# failure and prints VERDICT on its last line.
#
# STRICT=1 is the load-bearing part. Without it a missing toolchain prints
# VERDICT: SKIP and exits 0 -- correct for a laptop, useless for CI, where a
# green tick that only means "ngspice was not installed" is worse than no CI
# at all. STRICT=1 turns that skip into a failure.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # For the drift job below only. A pin nobody is told to bump is a pin that
  # rots, and the longer it sits the larger the jump when someone finally
  # moves it.
  schedule:
    - cron: '17 6 * * 1'

# Shared by both jobs, so the pin exists in ONE place. It used to be
# job-level, with drift re-typing the same SHA into an echo -- two copies of
# a value whose entire purpose is to be compared against a third.
env:
  # xezim is PINNED rather than tracked. This repo's job is to test itself,
  # not to be the first to notice an upstream regression: a floating ref
  # would make the gate red for reasons that have nothing to do with a
  # change here. Bump deliberately, and read the drift job when you do --
  # it is what tells you the pin has gone stale, and whether moving is safe.
  XEZIM_REF: 340945e4d598ae30dad68209d199ee99be6d41d7
  XEZIM: ${{ github.workspace }}/xezim/target/release/xezim
  # TEMPORARY, and self-removing: see "Patch xezim-core" below.
  XEZIM_CORE_PR_REV: 702dd7a59566da555e9b1350dca39a9900df8aca

jobs:
  gate:
    # The authoritative check: a fixed xezim, so a red gate always means a
    # change HERE. Never runs on the schedule.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # The packaged shared library, not an ngspice build. The examples are
      # pure analog -- no XSPICE code models -- so the stock package is
      # enough, and build.sh finds it through the loader.
      - name: Install libngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libngspice0-dev
          ldconfig -p | grep libngspice
          # The runner's version is whatever its release ships, which is not
          # the version this was developed against. Print it: an incompatible
          # libngspice is the first thing to suspect when the gate fails here
          # but passes locally.
          dpkg-query -W -f='libngspice0-dev ${Version}\n' libngspice0-dev
          ls -l /usr/include/ngspice/sharedspice.h

      - uses: actions/checkout@v7
        with:
          repository: aionhw/xezim
          ref: ${{ env.XEZIM_REF }}
          path: xezim

      - uses: dtolnay/rust-toolchain@stable

      # TEMPORARY. examples/pll/pfd.sv writes its reset delay as `300ps`,
      # which is what the LRM says and what the file should say -- but it
      # needs aionhw/xezim-core#42, still open at time of writing. Without
      # that fix a time literal in a constant is folded against a fixed 1 ns
      # instead of the module's unit, so `300ps` becomes 0.3 and rounds to
      # ZERO at 1 ps precision: the reset delay vanishes silently and the PFD
      # gets a zero-width reset that no assertion here would catch.
      #
      # So CI builds xezim against that PR's head rather than the pinned
      # core. Pinned to a REV, not a branch, for the same reason XEZIM_REF is
      # -- and rebased onto the exact core rev xezim expects, so this
      # substitutes the fix and nothing else.
      #
      # WHEN #42 MERGES: delete this step and XEZIM_CORE_PR_REV, and drop it
      # from the cache key. Nothing else changes; pfd.sv already reads the
      # way it should.
      - name: Patch xezim-core to the open fix (temporary)
        run: |
          mkdir -p xezim/.cargo
          cat > xezim/.cargo/config.toml <<EOF
          [patch."https://github.com/aionhw/xezim-core.git"]
          xezim-core = { git = "https://github.com/vrajeshprakhya/xezim-core.git", rev = "${XEZIM_CORE_PR_REV}" }
          sv-parser  = { git = "https://github.com/vrajeshprakhya/xezim-core.git", rev = "${XEZIM_CORE_PR_REV}" }
          EOF
          cat xezim/.cargo/config.toml

      # Keyed on the pinned ref AND the patched core, so a bump to either
      # rebuilds rather than silently reusing a binary built from the other.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xezim
          key: ${{ env.XEZIM_REF }}-${{ env.XEZIM_CORE_PR_REV }}

      # working-directory, NOT --manifest-path. Cargo discovers
      # .cargo/config.toml by walking up from its CURRENT DIRECTORY, so
      # building from the repo root ignored the patch written above and
      # produced an unpatched binary while every step still reported
      # success. The verify step below is what caught it.
      - name: Build xezim
        working-directory: xezim
        run: cargo build --release

      # The reason this workflow is more complicated than it looks. If the
      # patch silently failed to apply, everything below still runs and the
      # PLL still locks -- only the reset delay is gone. Assert the fix is
      # actually in the binary, in the one place a human will look.
      - name: Verify the time-literal fix is present
        run: |
          cat > /tmp/timelit.sv <<'EOF'
          `timescale 1ps/1ps
          module timelit;
            localparam realtime D = 300ps;
            initial begin
              if (D == 300.0) $display("TIMELIT-OK %0.1f", D);
              else             $display("TIMELIT-BAD %0.6f (want 300.0)", D);
            end
          endmodule
          EOF
          out=$("$XEZIM" --no-cache /tmp/timelit.sv 2>&1) || true
          echo "$out" | grep -E 'TIMELIT-(OK|BAD)' || { echo "$out"; exit 1; }
          echo "$out" | grep -q TIMELIT-OK

      # Its own step on purpose. Folded into the gate, a compile or link
      # failure surfaces as "zero samples" with the reason swallowed by the
      # harness's output capture -- which is exactly how the first run here
      # failed, unreadably.
      - name: Build the bridge
        run: ./build.sh

      - name: Run the gate
        env:
          STRICT: 1
        run: ./tests/run_tests.sh

      # Waveforms are the artifact a human would actually look at when the
      # gate fails, and they are the one thing a log cannot show.
      - name: Upload waveforms
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: waveforms
          path: |
            examples/pll/*.vcd
            examples/pll/*.raw
            examples/rc/*.vcd
          if-no-files-found: ignore
          retention-days: 7

  # Same gate, against xezim's CURRENT main instead of the pin. Weekly, and
  # never on a push or a PR, so it can tell you the pin has gone stale
  # without ever being the reason your change is red. If this goes amber and
  # the gate above is green, the pin is what needs attention -- read this
  # job's log, then bump XEZIM_REF deliberately.
  #
  # continue-on-error, not a hard failure: upstream breaking is information,
  # not a defect in this repo, and a scheduled job that cries wolf gets
  # muted, which loses the signal entirely.
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install libngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libngspice0-dev

      - uses: actions/checkout@v7
        with:
          repository: aionhw/xezim
          path: xezim          # no ref: whatever main is today
          # Full history, because this job's whole output is a comparison
          # against XEZIM_REF: at the default depth of 1 the pinned commit
          # is not in the clone and "what moved" cannot be computed.
          fetch-depth: 0

      # Same temporary patch as the gate. Without it this job would sit
      # permanently amber for a reason that has nothing to do with drift,
      # which is how a scheduled job stops being read.
      - name: Patch xezim-core to the open fix (temporary)
        run: |
          mkdir -p xezim/.cargo
          cat > xezim/.cargo/config.toml <<EOF
          [patch."https://github.com/aionhw/xezim-core.git"]
          xezim-core = { git = "https://github.com/vrajeshprakhya/xezim-core.git", rev = "${XEZIM_CORE_PR_REV}" }
          sv-parser  = { git = "https://github.com/vrajeshprakhya/xezim-core.git", rev = "${XEZIM_CORE_PR_REV}" }
          EOF

      - name: Report what is being tested
        run: |
          head=$(git -C xezim rev-parse HEAD)
          echo "pinned in the gate: $XEZIM_REF"
          echo "xezim main today:   $head"
          if [ "$head" = "$XEZIM_REF" ]; then
            echo "the pin is current"
          elif git -C xezim cat-file -e "$XEZIM_REF^{commit}" 2>/dev/null; then
            echo "the pin is BEHIND by:"
            git -C xezim log --oneline "$XEZIM_REF..HEAD"
          else
            # A pinned commit that is no longer reachable from main -- force
            # push, rebase, or a ref from a branch that went away. Worth
            # saying out loud rather than reporting an empty diff.
            echo "the pinned commit is NOT in this clone's history"
          fi

      - uses: dtolnay/rust-toolchain@stable

      # working-directory for the same reason as the gate: cargo finds the
      # patch config by CWD, not by manifest path.
      - name: Build xezim from main
        working-directory: xezim
        run: cargo build --release

      # Same self-check as the gate, and for the same reason: a patch that
      # failed to apply leaves a green run with the reset delay silently
      # zero. Here it also distinguishes the two ways this job can go amber
      # -- upstream drifted, or the fix stopped applying to it.
      - name: Verify the time-literal fix is present
        run: |
          cat > /tmp/timelit.sv <<'EOF'
          `timescale 1ps/1ps
          module timelit;
            localparam realtime D = 300ps;
            initial begin
              if (D == 300.0) $display("TIMELIT-OK %0.1f", D);
              else             $display("TIMELIT-BAD %0.6f (want 300.0)", D);
            end
          endmodule
          EOF
          out=$("$XEZIM" --no-cache /tmp/timelit.sv 2>&1) || true
          echo "$out" | grep -E 'TIMELIT-(OK|BAD)' || { echo "$out"; exit 1; }
          echo "$out" | grep -q TIMELIT-OK

      - name: Build the bridge
        run: ./build.sh

      - name: Run the gate against upstream main
        env:
          STRICT: 1
        run: ./tests/run_tests.sh
